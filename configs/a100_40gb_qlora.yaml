model:
  model_id: Salesforce/xLAM-2-32b-fc-r
  revision: 5ddef330ce01999a05ff56726c543bd6a5fe7142
  trust_remote_code: false
  attn_implementation: sdpa

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

data:
  train_file: data/demo_train.jsonl
  eval_file: data/demo_eval.jsonl
  template_file: templates/tool_chat_template_xlam_qwen.jinja
  max_seq_length: 2048
  preprocessing_num_workers: 1
  overwrite_cache: false

training:
  output_dir: runs/xlam2-a100-qlora
  seed: 42
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  weight_decay: 0.0
  num_train_epochs: 1.0
  max_steps: -1
  warmup_steps: 0.03
  lr_scheduler_type: cosine
  logging_steps: 1
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  optim: paged_adamw_8bit
  bf16: true
  tf32: true
  dataloader_num_workers: 0
  pad_to_multiple_of: 8
  torch_empty_cache_steps: 10
  report_to:
    - tensorboard
