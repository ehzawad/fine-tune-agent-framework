[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlam2-fine-tune-agent-framework"
version = "0.2.0"
description = "Single-A100 QLoRA training and policy-bounded serving for Salesforce xLAM-2-32B"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "ehzawad"}]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
train = [
  "torch==2.13.0",
  "accelerate==1.14.0",
  "bitsandbytes==0.50.2",
  "datasets==5.0.1",
  "peft==0.20.0",
  "tensorboard>=2.20,<3",
  "transformers==5.16.1",
]
openai = [
  "openai==3.5.0",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff==0.16.5",
]

[project.scripts]
xlam2-agent = "xlam2_ops_agent.cli:main"
xlam2-train = "xlam2_ops_agent.training.train:main"
xlam2-preflight = "xlam2_ops_agent.training.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
